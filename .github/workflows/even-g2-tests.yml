name: Even G2 companion tests

on:
  pull_request:
  push:
    branches: [master]
    paths:
      - "companion/even-g2/**"
      - ".github/workflows/even-g2-tests.yml"

permissions:
  contents: read

jobs:
  companion:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: companion/even-g2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: companion/even-g2/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run package
      - run: npm run package:verify
      - run: npm run simulator:contract
