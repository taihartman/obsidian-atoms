name: AtomsCapture
options:
  bundleIdPrefix: app.tryatoms
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: JW4P4LQ994
    CODE_SIGN_STYLE: Automatic
packages:
  AtomsCaptureCore:
    path: .
targets:
  AtomsCapture:
    type: application
    platform: iOS
    sources:
      - path: AtomsCapture
    dependencies:
      - package: AtomsCaptureCore
        product: AtomsCaptureCore
      - target: AtomsCaptureWidget
      - target: AtomsCaptureActivity
    settings:
      base:
        # Unique dev bundle IDs (app.tryatoms.capture* already taken on other teams)
        PRODUCT_BUNDLE_IDENTIFIER: app.tryatoms.capture.tai
        PRODUCT_NAME: Atoms Capture
        INFOPLIST_FILE: AtomsCapture/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "0.1.0"
        CODE_SIGN_ENTITLEMENTS: AtomsCapture/AtomsCapture.entitlements
    entitlements:
      path: AtomsCapture/AtomsCapture.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.tryatoms.capture.tai
    info:
      path: AtomsCapture/Info.plist
      properties:
        CFBundleDisplayName: Atoms Capture
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: Atoms Capture listens so you can speak a thought into your vault.
        NSSpeechRecognitionUsageDescription: Atoms Capture turns speech into text for capture. Recognition stays on-device when your phone supports it.
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - atomscapture
            CFBundleURLName: app.tryatoms.capture.tai
    scheme:
      testTargets: []

  AtomsCaptureWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: AtomsCaptureWidget
    dependencies:
      - package: AtomsCaptureCore
        product: AtomsCaptureCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tryatoms.capture.tai.widget
        PRODUCT_NAME: AtomsCaptureWidget
        INFOPLIST_FILE: AtomsCaptureWidget/Info.plist
        SKIP_INSTALL: true
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "0.1.0"
        CODE_SIGN_ENTITLEMENTS: AtomsCaptureWidget/AtomsCaptureWidget.entitlements
    entitlements:
      path: AtomsCaptureWidget/AtomsCaptureWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.tryatoms.capture.tai
    info:
      path: AtomsCaptureWidget/Info.plist
      properties:
        CFBundleDisplayName: Atoms Capture
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  AtomsCaptureActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: AtomsCaptureActivity
    dependencies:
      - package: AtomsCaptureCore
        product: AtomsCaptureCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tryatoms.capture.tai.activity
        PRODUCT_NAME: AtomsCaptureActivity
        INFOPLIST_FILE: AtomsCaptureActivity/Info.plist
        SKIP_INSTALL: true
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "0.1.0"
        CODE_SIGN_ENTITLEMENTS: AtomsCaptureActivity/AtomsCaptureActivity.entitlements
    entitlements:
      path: AtomsCaptureActivity/AtomsCaptureActivity.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.tryatoms.capture.tai
    info:
      path: AtomsCaptureActivity/Info.plist
      properties:
        CFBundleDisplayName: Atoms Capture Activity
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSSupportsLiveActivities: true
