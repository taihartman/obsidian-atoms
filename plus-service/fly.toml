# Fly.io sketch for Atoms Plus (U7).
# Deploy from monorepo root so Dockerfile can COPY plus-service/* + plus-pricing.json:
#
#   fly deploy -a atoms-plus \
#     --config plus-service/fly.toml \
#     --dockerfile plus-service/Dockerfile
#
# Change `app` before first deploy.

app = "atoms-plus"
primary_region = "iad"

[build]
  # Prefer CLI: fly deploy --dockerfile plus-service/Dockerfile (context = cwd)

[env]
  PORT = "8787"
  ATOMS_PLUS_STORE = "postgres"
  ATOMS_PLUS_ENV = "production"
  DOGFOOD_AUTO_GRANT = "0"
  STRIPE_DOGFOOD_CHECKOUT = "0"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
