<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="440" viewBox="0 0 1040 440" role="img" aria-label="Cottage cheese, eggs, flour. Blend. Rest 3 to 5 min. Cook at 350 degrees.">
  <!--
    The note itself. Ingredients stay quiet; the three method lines are
    the thing you cook from. No card chrome, no serving stepper, no timer
    glyph. Those are Claude's UI. This is the atom.
  -->
  <rect x="0.5" y="0.5" width="1039" height="439" rx="28" fill="#121214" stroke="rgba(84,84,88,0.38)"/>

  <g font-family="system-ui,-apple-system,&quot;Helvetica Neue&quot;,sans-serif" font-size="28" fill="rgba(235,235,245,0.5)">
    <text x="96" y="108">cottage cheese · eggs · flour</text>
    <text x="96" y="150">baking powder · salt · vanilla</text>
  </g>

  <g font-family="system-ui,-apple-system,&quot;Helvetica Neue&quot;,sans-serif" font-size="48" font-weight="600" letter-spacing="-1" fill="#ffffff">
    <text x="92" y="246">Blend</text>
    <text x="92" y="314">Rest 3 to 5 min</text>
    <text x="92" y="382">Cook at 350°F</text>
  </g>
</svg>
