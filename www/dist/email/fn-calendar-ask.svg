<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="440" viewBox="0 0 1040 440" role="img" aria-label="On the calendar. Friday at 4.">
  <!--
    The daily ask, then the event. Words only. No calendar grid, no arrows.
  -->
  <rect x="0.5" y="0.5" width="1039" height="439" rx="28" fill="#121214" stroke="rgba(84,84,88,0.38)"/>

  <g font-family="system-ui,-apple-system,&quot;Helvetica Neue&quot;,sans-serif">
    <text x="96" y="168" font-size="32" fill="rgba(235,235,245,0.5)">on the calendar</text>
    <text x="92" y="280" font-size="56" font-weight="600" letter-spacing="-1.4" fill="#ffffff">Friday at 4</text>
  </g>
</svg>
