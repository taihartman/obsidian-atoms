<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="440" viewBox="0 0 1040 440" role="img" aria-label="Asked who I met at the gym. Answer: Dom, met two weeks ago.">
  <!-- Same plate as fn-face-no-name. An answer, without any chat chrome. -->
  <rect x="0.5" y="0.5" width="1039" height="439" rx="28" fill="#121214" stroke="rgba(84,84,88,0.38)"/>

  <!-- what you actually type -->
  <text x="96" y="150" fill="rgba(235,235,245,0.55)" font-family="system-ui,-apple-system,&quot;Helvetica Neue&quot;,sans-serif" font-size="32">who did I meet at the gym?</text>
  <text x="944" y="150" text-anchor="end" fill="rgba(235,235,245,0.34)" font-family="system-ui,-apple-system,&quot;Helvetica Neue&quot;,sans-serif" font-size="28">2 seconds</text>

  <!-- what comes back -->
  <rect x="96" y="196" width="5" height="132" rx="2.5" fill="#0a84ff"/>
  <text x="136" y="304" fill="#ffffff" font-family="system-ui,-apple-system,&quot;Helvetica Neue&quot;,sans-serif" font-size="108" font-weight="600" letter-spacing="-3">Dom</text>
  <text x="140" y="360" fill="rgba(235,235,245,0.5)" font-family="system-ui,-apple-system,&quot;Helvetica Neue&quot;,sans-serif" font-size="28">met two weeks ago · climbing gym</text>
</svg>
