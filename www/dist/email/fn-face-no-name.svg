<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="440" viewBox="0 0 1040 440" role="img" aria-label="A face you recognise beside an empty name field">
  <!--
    Field notes illustration set. One dark plate, no nested cards, no arrows.
    Amber = a person. Blue = the system answering. Everything else is grey.
    Type is the illustration; keep labels at 26px+ (renders at half size in mail).
  -->
  <defs>
    <linearGradient id="personFill" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#5a5a61"/>
      <stop offset="1" stop-color="#3a3a40"/>
    </linearGradient>
    <clipPath id="avatarClip">
      <circle cx="322" cy="220" r="104"/>
    </clipPath>
  </defs>

  <rect x="0.5" y="0.5" width="1039" height="439" rx="28" fill="#121214" stroke="rgba(84,84,88,0.38)"/>

  <!-- the face: unmistakably a person, deliberately not a specific one -->
  <g clip-path="url(#avatarClip)">
    <circle cx="322" cy="220" r="104" fill="#202024"/>
    <circle cx="322" cy="180" r="44" fill="url(#personFill)"/>
    <path d="M222 332 c0 -58 45 -100 100 -100 s100 42 100 100 z" fill="url(#personFill)"/>
  </g>
  <circle cx="322" cy="220" r="104" fill="none" stroke="#ff9f0a" stroke-opacity="0.5" stroke-width="2"/>

  <!-- the name: a field nothing was ever written in -->
  <text x="548" y="196" fill="rgba(235,235,245,0.42)" font-family="system-ui,-apple-system,&quot;Helvetica Neue&quot;,sans-serif" font-size="30" letter-spacing="3.6">NAME</text>
  <rect x="548" y="244" width="3" height="40" rx="1.5" fill="rgba(235,235,245,0.3)"/>
  <line x1="548" y1="284" x2="944" y2="284" stroke="rgba(235,235,245,0.26)" stroke-width="2" stroke-linecap="round"/>
</svg>
