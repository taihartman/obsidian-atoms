<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="440" viewBox="0 0 1040 440" role="img" aria-label="A rambling voice capture settling into a note titled Dom, tagged gym and people">
  <!-- Same plate and light. One continuous gesture: the mess calms into the line it is filed on. -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17171b"/>
      <stop offset="1" stop-color="#0f0f12"/>
    </linearGradient>
    <radialGradient id="warmGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff9f0a" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#ff9f0a" stop-opacity="0"/>
    </radialGradient>
    <!-- userSpaceOnUse, not the default: these paint zero-width lines and a
         zero-height rule, whose object bounding boxes are degenerate, and an
         objectBoundingBox gradient on those simply does not render. -->
    <!-- the voice is loudest where it starts and gives out on its own -->
    <linearGradient id="voiceFade" gradientUnits="userSpaceOnUse" x1="96" y1="0" x2="420" y2="0">
      <stop offset="0" stop-color="#ffb340"/>
      <stop offset="0.45" stop-color="#ff9f0a"/>
      <stop offset="1" stop-color="#ff9f0a" stop-opacity="0.35"/>
    </linearGradient>
    <!-- the line fades in exactly where the voice runs out -->
    <linearGradient id="lineFade" gradientUnits="userSpaceOnUse" x1="400" y1="0" x2="600" y2="0">
      <stop offset="0" stop-color="#ebebf5" stop-opacity="0"/>
      <stop offset="1" stop-color="#ebebf5" stop-opacity="0.24"/>
    </linearGradient>
  </defs>

  <rect x="0.5" y="0.5" width="1039" height="439" rx="28" fill="url(#plate)" stroke="rgba(84,84,88,0.38)"/>

  <ellipse cx="170" cy="230" rx="230" ry="160" fill="url(#warmGlow)"/>

  <g stroke="url(#voiceFade)" stroke-width="4.5" stroke-linecap="round">
    <line x1="96" y1="197.2" x2="96" y2="262.8" />
    <line x1="111" y1="166.0" x2="111" y2="294.0" />
    <line x1="126" y1="192.8" x2="126" y2="267.2" />
    <line x1="141" y1="167.4" x2="141" y2="292.6" />
    <line x1="156" y1="189.6" x2="156" y2="270.4" />
    <line x1="171" y1="180.7" x2="171" y2="279.3" />
    <line x1="186" y1="205.8" x2="186" y2="254.2" />
    <line x1="201" y1="194.0" x2="201" y2="266.0" />
    <line x1="216" y1="205.5" x2="216" y2="254.5" />
    <line x1="231" y1="195.6" x2="231" y2="264.4" />
    <line x1="246" y1="216.2" x2="246" y2="243.8" />
    <line x1="261" y1="209.3" x2="261" y2="250.7" />
    <line x1="276" y1="216.1" x2="276" y2="243.9" />
    <line x1="291" y1="211.6" x2="291" y2="248.4" />
    <line x1="306" y1="221.8" x2="306" y2="238.2" />
    <line x1="321" y1="220.5" x2="321" y2="239.5" />
    <line x1="336" y1="223.9" x2="336" y2="236.1" />
    <line x1="351" y1="223.2" x2="351" y2="236.8" />
    <line x1="366" y1="227.5" x2="366" y2="232.5" />
    <line x1="381" y1="227.5" x2="381" y2="232.5" />
    <line x1="396" y1="227.5" x2="396" y2="232.5" />
    <line x1="411" y1="227.5" x2="411" y2="232.5" />
  </g>

  <line x1="400" y1="230" x2="920" y2="230" stroke="url(#lineFade)" stroke-width="2" stroke-linecap="round"/>

  <text x="96" y="330" fill="rgba(235,235,245,0.42)" font-family="system-ui,-apple-system,&quot;Helvetica Neue&quot;,sans-serif" font-size="28">a rambling half-sentence</text>

  <!-- filed: titled, tagged, linked, without being asked -->
  <text x="640" y="206" fill="#ffffff" font-family="system-ui,-apple-system,&quot;Helvetica Neue&quot;,sans-serif" font-size="56" font-weight="600" letter-spacing="-1.4">Dom</text>

  <g font-family="system-ui,-apple-system,&quot;Helvetica Neue&quot;,sans-serif" font-size="26">
    <rect x="640" y="264" width="98" height="44" rx="22" fill="none" stroke="rgba(235,235,245,0.3)"/>
    <text x="689" y="293" text-anchor="middle" fill="rgba(235,235,245,0.55)">gym</text>
    <rect x="752" y="264" width="126" height="44" rx="22" fill="rgba(255,159,10,0.08)" stroke="#ff9f0a" stroke-opacity="0.45"/>
    <text x="815" y="293" text-anchor="middle" fill="#ff9f0a" fill-opacity="0.85">people</text>
  </g>
</svg>
