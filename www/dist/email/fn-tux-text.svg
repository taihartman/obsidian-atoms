<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="440" viewBox="0 0 1040 440" role="img" aria-label="A screenshot of the shop text. The tux is ready.">
  <!--
    Flat plate, words only. The capture is a screenshot, the note is the
    title. No glow, no phone frame, no street.
  -->
  <rect x="0.5" y="0.5" width="1039" height="439" rx="28" fill="#121214" stroke="rgba(84,84,88,0.38)"/>

  <g font-family="system-ui,-apple-system,&quot;Helvetica Neue&quot;,sans-serif">
    <text x="96" y="168" font-size="32" fill="rgba(235,235,245,0.5)">a screenshot of the shop text</text>
    <text x="92" y="280" font-size="56" font-weight="600" letter-spacing="-1.4" fill="#ffffff">The tux is ready</text>
  </g>
</svg>
