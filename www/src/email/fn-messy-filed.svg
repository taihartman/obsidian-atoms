<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="420" viewBox="0 0 1040 420" role="img" aria-label="Messy voice note becomes a clean filed atom">
  <rect width="1040" height="420" fill="#000"/>
  <rect x="80" y="40" width="880" height="340" rx="28" fill="#1c1c1e" stroke="rgba(84,84,88,0.55)"/>
  <!-- messy capture -->
  <rect x="120" y="100" width="320" height="200" rx="20" fill="#2c2c2e"/>
  <text x="280" y="145" text-anchor="middle" fill="rgba(235,235,245,0.55)" font-family="system-ui,sans-serif" font-size="18">In the car</text>
  <!-- waveform-ish mess -->
  <path d="M160 220 C180 180 200 260 220 200 S260 240 280 210 S320 250 340 205 S380 230 400 215" fill="none" stroke="#ff9f0a" stroke-width="4" stroke-linecap="round"/>
  <text x="280" y="275" text-anchor="middle" fill="rgba(235,235,245,0.72)" font-family="system-ui,sans-serif" font-size="16">rambling half-sentence</text>
  <!-- arrow -->
  <path d="M470 200 H560" stroke="#0a84ff" stroke-width="5" stroke-linecap="round"/>
  <path d="M545 186 L565 200 L545 214" fill="none" stroke="#0a84ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- clean note -->
  <rect x="590" y="100" width="320" height="200" rx="20" fill="#2c2c2e" stroke="#0a84ff" stroke-width="2"/>
  <text x="750" y="145" text-anchor="middle" fill="rgba(235,235,245,0.55)" font-family="system-ui,sans-serif" font-size="18">Filed</text>
  <text x="750" y="200" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="36" font-weight="600">Dom</text>
  <rect x="670" y="225" width="70" height="28" rx="14" fill="rgba(10,132,255,0.25)" stroke="#0a84ff"/>
  <text x="705" y="244" text-anchor="middle" fill="#0a84ff" font-family="system-ui,sans-serif" font-size="14">gym</text>
  <rect x="755" y="225" width="90" height="28" rx="14" fill="rgba(255,159,10,0.2)" stroke="#ff9f0a"/>
  <text x="800" y="244" text-anchor="middle" fill="#ff9f0a" font-family="system-ui,sans-serif" font-size="14">people</text>
</svg>
