    - generic [ref=f9e165]:
      - paragraph [ref=f9e166]: Starting out
      - heading "Bring the notes you already have" [level=2] [ref=f9e167]
      - paragraph [ref=f9e168]: You do not have to wait a year to get there. Atoms can read every past daily note in one pass and build the library out of the history you already wrote.
      - list [ref=f9e169]:
        - listitem [ref=f9e170]:
          - text: ↳
          - strong [ref=f9e171]: One pass, bulk rate.
          - text: A catch-up runs as a batch job at about half the usual cost, on a cheaper model chosen for volume.
        - listitem [ref=f9e172]:
          - text: ↳
          - strong [ref=f9e173]: You see the bill first.
          - text: It counts the real tokens in your vault and shows you the range. Nothing is spent until you confirm.
        - listitem [ref=f9e174]:
          - text: ↳
          - strong [ref=f9e175]: Safe to re-run.
          - text: Anything already filed is skipped, so a catch-up can be stopped and started again without doing the work, or the spending, twice.
      - paragraph [ref=f9e176]: Catch-up runs on your own Anthropic API key, which you can add in Settings whether or not you are on Plus. The figure shown is an estimate from public rates, not a quote.
    - generic [ref=f9e178]:
      - paragraph [ref=f9e179]: What stays true
      - list [ref=f9e180]:
        - listitem [ref=f9e181]:
          - text: ↳
          - strong [ref=f9e182]: See it before it writes.
          - text: Preview shows the exact notes, links, and markers Process would create. Nothing touches your vault until you say so.
        - listitem [ref=f9e183]:
          - text: ↳
          - strong [ref=f9e184]: Your words, unchanged.
          - text: Only the title, tags, and links are written for you. A half-formed hunch stays half-formed instead of becoming confident-sounding prose.
        - listitem [ref=f9e185]:
          - text: ↳
          - strong [ref=f9e186]: Links, not folders.
          - text: Nothing gets filed away somewhere you have to remember.
        - listitem [ref=f9e187]:
          - text: ↳
          - strong [ref=f9e188]: Leaving is easy.
          - text: Cancel Plus or uninstall the plugin entirely and every atom is still there, still linked, still searchable. They were always just markdown in your vault. With your own key, filing keeps working, at Anthropic's usage cost and nothing to us.
        - listitem [ref=f9e189]:
          - text: ↳
          - strong [ref=f9e190]: Not a task app.
          - text: No due dates, no checklists, no backlog filling up behind you.
