    - generic [ref=f9e54]:
      - paragraph [ref=f9e55]: A note you cannot find again is a note you did not take.
      - paragraph [ref=f9e56]: So Atoms does the filing you never do. Every capture becomes its own note, titled in plain words and linked to the people and ideas it touches. You keep writing one line.
    - generic [ref=f9e58]:
      - paragraph [ref=f9e59]: How it works
      - heading "You only do the first step." [level=2] [ref=f9e60]
      - list [ref=f9e61]:
        - listitem [ref=f9e62]:
          - generic [ref=f9e63]: ↳
          - generic [ref=f9e64]:
            - heading "Catch it in five seconds" [level=3] [ref=f9e65]
            - paragraph [ref=f9e66]: Atoms installs a shortcut on your iPhone. Run it from your home screen, the share sheet, or Siri, and say the thought out loud instead of typing it. It lands in today's daily note before you have put your phone down.
            - paragraph [ref=f9e67]: On a desktop, type a line. Either way, nothing new to learn and nowhere new to put it.
        - listitem [ref=f9e68]:
          - generic [ref=f9e69]: ↳
          - generic [ref=f9e70]:
            - heading "Come back and it is sorted" [level=3] [ref=f9e71]
            - paragraph [ref=f9e72]: Yesterday's captures become notes with a real title and links to what they relate to. Let it happen on its own each time you open Obsidian, or keep it to one tap.
        - listitem [ref=f9e73]:
          - generic [ref=f9e74]: ↳
          - generic [ref=f9e75]:
            - heading "Now you can find it" [level=3] [ref=f9e76]
            - paragraph [ref=f9e77]: Ask for it, or let it come back to you. Both are below.
      - generic [ref=f9e79]:
        - paragraph [ref=f9e80]: Your daily note
        - generic [ref=f9e81]: "- sam stopped at the tulip stand again, she loves the yellow ones - pick up milk"
        - paragraph [ref=f9e83]: What Atoms makes
        - generic [ref=f9e84]:
          - generic [ref=f9e85]: Sam loves yellow tulips
          - generic [ref=f9e86]: sam stopped at the tulip stand again, she loves the yellow ones Linked to Sam and Gift ideas.
        - paragraph [ref=f9e87]: Your original line is never touched, and the text is copied across word for word. The milk? It becomes nothing. Atoms is not a reminders app, so errands stay in your daily note and out of your library.
    - generic [ref=f9e89]:
      - paragraph [ref=f9e90]: When you go looking
      - heading "Ask from Claude or ChatGPT" [level=2] [ref=f9e91]
      - paragraph [ref=f9e92]: Atoms plugs into the chat window you already have open, so your own notes become something you can question.
      - list [ref=f9e93]:
        - listitem [ref=f9e94]:
          - text: ↳
          - strong [ref=f9e95]: It reads the library, not the pile.
          - text: Every note it looks at already has a real title, tags, and links. That is why the answers are any good. Pointing a chatbot at raw daily pages does not work.
        - listitem [ref=f9e96]:
          - text: ↳
          - strong [ref=f9e97]: Ask for it.
          - text: It finds your notes by title, tags, and text, then quotes them back with a link to the original.
        - listitem [ref=f9e98]:
          - text: ↳
          - strong [ref=f9e99]: Follow the thread.
          - text: Your notes form a graph, and it walks the links. The gift question finds the tulip note because both point at Sam.
        - text: ↳ ↳
        - listitem [ref=f9e100]:
          - text: ↳
          - strong [ref=f9e101]: Add without leaving chat.
          - text: Tell it to remember something and it queues a new note for your vault. It lands next time Obsidian is open.
        - listitem [ref=f9e102]:
          - text: ↳
          - strong [ref=f9e103]: Change your mind safely.
          - text: A revision becomes a new note linked to the old one. It never overwrites you.
