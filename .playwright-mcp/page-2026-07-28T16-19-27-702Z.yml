      - paragraph [ref=f1e24]: How it works
      - heading "Three steps, and you only do the first one." [level=2] [ref=f1e25]
      - list [ref=f1e26]:
        - listitem [ref=f1e27]:
          - generic [ref=f1e28]: ↳
          - generic [ref=f1e29]:
            - heading "You capture, however you already do" [level=3] [ref=f1e30]
            - paragraph [ref=f1e31]: A bullet in today's daily note, a shortcut on your phone, anything that drops text into Obsidian. Atoms does not give you a capture box and does not ask you to change how you write.
        - listitem [ref=f1e32]:
          - generic [ref=f1e33]: ↳
          - generic [ref=f1e34]:
            - heading "Atoms processes past days" [level=3] [ref=f1e35]
            - paragraph [ref=f1e36]: When you run Process, Atoms reads captures from previous days and gives each one a declarative title, tags, and links to related notes. Today is skipped by default, so writing in the moment stays quiet.
        - listitem [ref=f1e37]:
          - generic [ref=f1e38]: ↳
          - generic [ref=f1e39]:
            - heading "Your library brings things back" [level=3] [ref=f1e40]
            - paragraph [ref=f1e41]: Atoms land flat in one folder and connect through links, not folders. The home view resurfaces them as a stream you can wander, not a queue that nags.
    - generic [ref=f1e43]:
      - paragraph [ref=f1e44]: What you get
      - paragraph [ref=f1e45]: Your words are the record. Everything the model writes sits around them, never on top of them.
      - list [ref=f1e46]:
        - listitem [ref=f1e47]:
          - text: ↳
          - strong [ref=f1e48]: Verbatim bodies.
          - text: The capture text is copied into the atom unchanged. Titles, tags, and links are the only things generated.
        - listitem [ref=f1e49]:
          - text: ↳
          - strong [ref=f1e50]: Links, not folders.
          - text: Nothing is filed into a hierarchy. Atoms land flat and find each other through reason-bearing links.
        - listitem [ref=f1e51]:
          - text: ↳
          - strong [ref=f1e52]: Nothing destroyed.
          - text: Processing is idempotent and re-runnable. Your daily notes are only ever appended to, never rewritten.
        - listitem [ref=f1e53]:
          - text: ↳
          - strong [ref=f1e54]: Desktop, iOS, and Android.
          - text: It is a normal Obsidian plugin over normal markdown files in your own vault.
        - listitem [ref=f1e55]:
          - text: ↳
          - strong [ref=f1e56]: Not a task app.
          - text: No due dates, no checklists, no backlog quietly filling up behind you.
