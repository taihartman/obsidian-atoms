            - heading "Catch it in five seconds" [level=3] [ref=f10e42]
            - paragraph [ref=f10e43]: Atoms installs a shortcut on your iPhone. Run it from your home screen, the share sheet, or Siri, and say the thought out loud instead of typing it. It lands in today's daily note before you have put your phone down.
            - paragraph [ref=f10e44]: On a desktop, type a line. Either way, nothing new to learn and nowhere new to put it.
        - listitem [ref=f10e45]:
          - generic [ref=f10e46]: ↳
          - generic [ref=f10e47]:
            - heading "Come back and it is sorted" [level=3] [ref=f10e48]
            - paragraph [ref=f10e49]: Yesterday's captures become notes with a real title and links to what they relate to. Let it happen on its own each time you open Obsidian, or keep it to one tap.
        - listitem [ref=f10e50]:
          - generic [ref=f10e51]: ↳
