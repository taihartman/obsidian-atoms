    - generic [ref=f10e66]:
      - paragraph [ref=f10e67]: When you go looking
      - heading "Ask from Claude or ChatGPT" [level=2] [ref=f10e68]
      - paragraph [ref=f10e69]: Atoms plugs into the chat window you already have open, so your own notes become something you can question.
      - list [ref=f10e70]:
        - listitem [ref=f10e71]:
          - text: ↳
          - strong [ref=f10e72]: It reads the library, not the pile.
          - text: Every note it looks at already has a real title, tags, and links. That is why the answers are any good. Pointing a chatbot at raw daily pages does not work.
        - listitem [ref=f10e73]:
          - text: ↳
          - strong [ref=f10e74]: Ask for it.
          - text: It finds your notes by title, tags, and text, then quotes them back with a link to the original.
        - listitem [ref=f10e75]:
          - text: ↳
          - strong [ref=f10e76]: Follow the thread.
          - text: Your notes form a graph, and it walks the links. The gift question finds the tulip note because both point at Sam.
        - text: ↳ ↳
        - listitem [ref=f10e77]:
          - text: ↳
          - strong [ref=f10e78]: Add without leaving chat.
          - text: Tell it to remember something and it queues a new note for your vault. It lands next time Obsidian is open.
        - listitem [ref=f10e79]:
          - text: ↳
          - strong [ref=f10e80]: Change your mind safely.
          - text: A revision becomes a new note linked to the old one. It never overwrites you.
