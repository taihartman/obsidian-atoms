    - generic [ref=f1e53]:
      - paragraph [ref=f1e54]: When you go looking
      - heading "Ask from Claude or ChatGPT" [level=2] [ref=f1e55]
      - paragraph [ref=f1e56]: Atoms plugs into the chat window you already have open, so your own notes become something you can question.
      - list [ref=f1e57]:
        - listitem [ref=f1e58]:
          - text: ↳
          - strong [ref=f1e59]: It reads the library, not the pile.
          - text: Every note it looks at already has a real title, tags, and links. That is why the answers are any good. Pointing a chatbot at raw daily pages does not work.
        - listitem [ref=f1e60]:
          - text: ↳
          - strong [ref=f1e61]: Ask for it.
          - text: It finds your notes by title, tags, and text, then quotes them back with a link to the original.
        - listitem [ref=f1e62]:
          - text: ↳
          - strong [ref=f1e63]: Follow the thread.
          - text: Ask what connects to something and it walks the links between your notes.
        - listitem [ref=f1e64]:
          - text: ↳
          - strong [ref=f1e65]: Add without leaving chat.
          - text: Tell it to remember something and it queues a new note for your vault. It lands next time Obsidian is open.
        - listitem [ref=f1e66]:
          - text: ↳
          - strong [ref=f1e67]: Change your mind safely.
          - text: A revision becomes a new note linked to the old one. It never overwrites you.
      - paragraph [ref=f1e68]: "Matching is on the words you actually wrote, not a semantic model. Your daily notes and the rest of your vault are never sent, only the notes Atoms filed. Connector URL for Plus: https://plus.tryatoms.app/mcp"
