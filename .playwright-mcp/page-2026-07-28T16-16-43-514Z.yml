          - text: ↳
          - strong [ref=e64]: No API key setup
          - text: on phone or desktop. Filing runs through our key instead of yours.
        - listitem [ref=e65]:
          - text: ↳
          - strong [ref=e66]: 150 AI filings each month.
          - text: One filing is one capture classified, not one note. Unused filings do not roll over, and your allotment starts over on your billing date.
        - listitem [ref=e67]:
          - text: ↳
          - strong [ref=e68]: Need more before then?
          - text: A one time top up adds 50 filings for $2. It does not change or renew your subscription.
        - listitem [ref=e69]:
          - text: ↳
          - strong [ref=e70]: Ask is included
          - text: if you turn it on. See below.
      - paragraph [ref=e71]: "AI usage has a real cost. Your subscription helps cover that and supports ongoing development. Your library stays free either way: the rest of Atoms does not require a subscription."
