      - paragraph [ref=e24]: How it works
      - heading "Three steps, and you only do the first one." [level=2] [ref=e25]
      - list [ref=e26]:
        - listitem [ref=e27]:
          - generic [ref=e28]: ↳
          - generic [ref=e29]:
            - heading "You capture, however you already do" [level=3] [ref=e30]
            - paragraph [ref=e31]: A bullet in today's daily note, a shortcut on your phone, anything that drops text into Obsidian. Atoms does not give you a capture box and does not ask you to change how you write.
        - listitem [ref=e32]:
          - generic [ref=e33]: ↳
          - generic [ref=e34]:
            - heading "Atoms processes past days" [level=3] [ref=e35]
            - paragraph [ref=e36]: When you run Process, Atoms reads captures from previous days and gives each one a declarative title, tags, and links to related notes. Today is skipped by default, so writing in the moment stays quiet.
        - listitem [ref=e37]:
          - generic [ref=e38]: ↳
          - generic [ref=e39]:
            - heading "Your library brings things back" [level=3] [ref=e40]
            - paragraph [ref=e41]: Atoms land flat in one folder and connect through links, not folders. The home view resurfaces them as a stream you can wander, not a queue that nags.
    - generic [ref=e43]:
      - paragraph [ref=e44]: What you get
      - paragraph [ref=e45]: Your words are the record. Everything the model writes sits around them, never on top of them.
      - list [ref=e46]:
        - listitem [ref=e47]:
          - text: ↳
          - strong [ref=e48]: Verbatim bodies.
          - text: The capture text is copied into the atom unchanged. Titles, tags, and links are the only things generated.
        - listitem [ref=e49]:
          - text: ↳
          - strong [ref=e50]: Links, not folders.
          - text: Nothing is filed into a hierarchy. Atoms land flat and find each other through reason-bearing links.
        - listitem [ref=e51]:
          - text: ↳
          - strong [ref=e52]: Nothing destroyed.
          - text: Processing is idempotent and re-runnable. Your daily notes are only ever appended to, never rewritten.
        - listitem [ref=e53]:
          - text: ↳
          - strong [ref=e54]: Desktop, iOS, and Android.
          - text: It is a normal Obsidian plugin over normal markdown files in your own vault.
        - listitem [ref=e55]:
          - text: ↳
          - strong [ref=e56]: Not a task app.
          - text: No due dates, no checklists, no backlog quietly filling up behind you.
    - generic [ref=e58]:
