    - generic [ref=f2e27]:
      - paragraph [ref=f2e28]: A note you cannot find again is a note you did not take.
      - paragraph [ref=f2e29]: Capture was never the hard part. You have years of it. The hard part is that none of it comes back to you at the moment it would have been useful. Atoms is built around that second half.
