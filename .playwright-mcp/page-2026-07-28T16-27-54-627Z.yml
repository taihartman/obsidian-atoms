            - heading "You capture, however you already do" [level=3] [ref=f2e38]
            - paragraph [ref=f2e39]: A bullet in today's daily note, a shortcut on your phone, anything that drops text into Obsidian. Atoms does not give you a capture box and does not ask you to change how you write.
