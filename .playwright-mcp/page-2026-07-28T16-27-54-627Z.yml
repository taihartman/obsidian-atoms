    - generic [ref=f2e66]:
      - paragraph [ref=f2e67]: Recall, when you go looking
      - heading "Ask your notes from Claude or ChatGPT" [level=2] [ref=f2e68]
      - paragraph [ref=f2e69]: Atoms runs a connector your assistant can use. Turn it on and your atoms become something you can interrogate in the chat window you already have open.
      - list [ref=f2e70]:
        - listitem [ref=f2e71]:
          - text: ↳
          - strong [ref=f2e72]: It searches your atoms
          - text: by title, tags, and text, and pulls the full note before quoting it. Answers cite the atom they came from, so you can open the original.
        - listitem [ref=f2e73]:
          - text: ↳
          - strong [ref=f2e74]: It follows your links.
          - text: Ask what connects to something and it walks the links and backlinks around it, which is the part a plain file search cannot do.
        - listitem [ref=f2e75]:
          - text: ↳
          - strong [ref=f2e76]: It can add to your library.
          - text: Tell it to capture a thought and it queues a new atom for your vault. It lands next time Obsidian is open, usually within a minute.
        - listitem [ref=f2e77]:
          - text: ↳
          - strong [ref=f2e78]: It never overwrites you.
          - text: Revising a note creates a new atom linked to the original as a revision. Your earlier thinking stays intact and you can see that you changed your mind.
        - listitem [ref=f2e79]:
          - text: ↳
          - strong [ref=f2e80]: "Connector URL:"
          - text: https://plus.tryatoms.app/mcp
      - paragraph [ref=f2e81]: Search is keyword and tag matching over your atoms, not a semantic model, so it finds the words you actually wrote. Only your flat atoms folder is reachable. Daily notes and the rest of your vault are not.
    - generic [ref=f2e83]:
      - paragraph [ref=f2e84]: Recall, when you are not looking
      - heading "Sometimes it comes back on its own" [level=2] [ref=f2e85]
      - paragraph [ref=f2e86]: Open Atoms and it may hand you one thing you had forgotten. Not a feed. One card.
      - list [ref=f2e87]:
        - listitem [ref=f2e88]:
          - text: ↳
          - strong [ref=f2e89]: "\"Also about Nichita.\""
          - text: You file something new that links to a person, and an older note about the same person comes back the next time you open Atoms.
        - listitem [ref=f2e90]:
          - text: ↳
          - strong [ref=f2e91]: "\"On this day.\""
          - text: Something you wrote on this date in a previous year.
        - listitem [ref=f2e92]:
          - text: ↳
          - strong [ref=f2e93]: "\"Mind change.\""
          - text: Two notes where you came to disagree with yourself, shown side by side.
        - listitem [ref=f2e94]:
          - text: ↳
          - strong [ref=f2e95]: One at a time.
          - text: Tap to open the note, or press Another to see something else. The same memory will not come back for a week.
      - paragraph [ref=f2e96]: This only happens while you have Atoms open. There are no notifications, no reminders, no review queue, and nothing is ever due. If you do not open Atoms, nothing happens.
    - generic [ref=f2e98]:
      - paragraph [ref=f2e99]: What stays true
      - list [ref=f2e100]:
        - listitem [ref=f2e101]:
          - text: ↳
          - strong [ref=f2e102]: Your words are the record.
          - text: Capture text is copied into the atom unchanged. Titles, tags, and links are the only things generated.
        - listitem [ref=f2e103]:
          - text: ↳
          - strong [ref=f2e104]: Links, not folders.
          - text: Nothing is filed into a hierarchy. Atoms land flat and find each other through reason-bearing links.
        - listitem [ref=f2e105]:
          - text: ↳
          - strong [ref=f2e106]: Nothing destroyed.
          - text: Processing is idempotent and re-runnable. Your daily notes are only ever appended to.
        - listitem [ref=f2e107]:
          - text: ↳
          - strong [ref=f2e108]: Plain files you own.
          - text: Markdown in your own vault. Uninstall the plugin and every note is still there and still readable.
        - listitem [ref=f2e109]:
          - text: ↳
          - strong [ref=f2e110]: Desktop, iOS, and Android.
          - text: A normal Obsidian plugin on all three.
        - listitem [ref=f2e111]:
          - text: ↳
          - strong [ref=f2e112]: Not a task app.
          - text: No due dates, no checklists, no backlog quietly filling up behind you.
    - generic [ref=f2e114]:
      - paragraph [ref=f2e115]: Optional
      - heading "Atoms Plus" [level=2] [ref=f2e116]
      - paragraph [ref=f2e117]: Filing and Ask both run on an AI model, which needs an API key. Plus is the version where you do not have to deal with that.
      - list [ref=f2e118]:
        - listitem [ref=f2e119]:
          - text: ↳
          - strong [ref=f2e120]: No API key setup
          - text: on phone or desktop. Filing runs through our key instead of yours.
        - listitem [ref=f2e121]:
          - text: ↳
          - strong [ref=f2e122]: Ask is included.
          - text: The Claude and ChatGPT connector is part of Plus.
        - listitem [ref=f2e123]:
          - text: ↳
          - strong [ref=f2e124]: 150 AI filings each month.
          - text: One filing is one capture classified, not one note. Unused filings do not roll over, and your allotment starts over on your billing date.
        - listitem [ref=f2e125]:
          - text: ↳
          - strong [ref=f2e126]: Need more before then?
          - text: A one time top up adds 50 filings for $2. It does not change or renew your subscription.
      - paragraph [ref=f2e127]: "AI usage has a real cost. Your subscription helps cover that and supports ongoing development. Your library stays free either way: the rest of Atoms does not require a subscription."
